<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto · Santino Rodriguez</title>
  <link rel="icon" href="logoSR.png?v=1">
  <link rel="stylesheet" href="estilos.css">
</head>

<body>

  <nav class="nav">
    <span class="logo">Santino.Rodriguez</span>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="experiencia.html">Experiencia</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </nav>

<section class="seccion bg-fade centro">
    <h2>Contacto</h2>

<div class="formulario" id="formulario">

  <div class="campo">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Tu nombre">
  </div>

  <div class="campo">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="tu@email.com">
  </div>

  <div class="campo">
    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" rows="5" placeholder="Escribí tu mensaje..."></textarea>
  </div>

  <button class="boton-enviar" onclick="enviar()">Enviar mensaje</button>

<p id="exito" style="display:none; color:#38bdf8; font-weight:600;">
  ✓ Mensaje enviado correctamente
</p>

</div>
  </section>

  <footer class="footer">
    <p>© Santino Rodriguez · Desarrollador Full Stack</p>
  </footer>

  <script>
  function enviar() {
    document.getElementById('nombre').value = '';
    document.getElementById('email').value = '';
    document.getElementById('mensaje').value = '';

    document.getElementById('exito').style.display = 'block';

    setTimeout(function() {
      document.getElementById('exito').style.display = 'none';
    }, 3000);
  }
</script>

</body>

</html>
